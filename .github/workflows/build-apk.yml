name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite lanzar el build manualmente desde la pestaña Actions

permissions:
  contents: write # necesario para crear/actualizar el release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK (nombre del repositorio)
        run: cp app/build/outputs/apk/debug/app-debug.apk android_cliente_app.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest android_cliente_app.apk \
            --title "Android Cliente App (latest)" \
            --notes "APK de debug compilada automáticamente desde la rama ${GITHUB_REF_NAME}." \
            --prerelease
